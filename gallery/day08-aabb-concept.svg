<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="920" height="470" fill="#0d1117"/>

  <text x="460" y="40" fill="#e6edf3" font-size="21" font-weight="700" text-anchor="middle">
    Day 8 · AABB 包围盒：用"便宜的盒子"快速淘汰物体
  </text>

  <!-- ============ 左：盒子命中，球没命中 ============ -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="360" height="230" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="180" y="30" fill="#8b949e" font-size="14" text-anchor="middle">情况 A：盒子中了，球没中</text>

    <!-- 盒子 -->
    <rect x="90" y="55" width="180" height="150" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="7 4"/>
    <!-- 球 -->
    <circle cx="180" cy="130" r="52" fill="#3fb950" fill-opacity="0.22" stroke="#3fb950" stroke-width="2.5"/>
    <!-- 射线：从左上穿过盒子，走角落，没碰到球 -->
    <line x1="20" y1="70" x2="340" y2="185" stroke="#f85149" stroke-width="3"/>
    <polygon points="340,185 326,178 330,190" fill="#f85149"/>
    <text x="28" y="64" fill="#f85149" font-size="12">光线</text>

    <text x="180" y="228" fill="#d29922" font-size="13" text-anchor="middle">
      → 盒子中了，才继续做精确的球体求交
    </text>
  </g>

  <!-- ============ 右：盒子都没中 ============ -->
  <g transform="translate(500, 80)">
    <rect x="0" y="0" width="360" height="230" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="180" y="30" fill="#8b949e" font-size="14" text-anchor="middle">情况 B：盒子都没中</text>

    <rect x="90" y="55" width="180" height="150" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="7 4"/>
    <circle cx="180" cy="130" r="52" fill="#3fb950" fill-opacity="0.22" stroke="#3fb950" stroke-width="2.5"/>

    <!-- 射线从盒子下方掠过 -->
    <line x1="20" y1="218" x2="340" y2="196" stroke="#f85149" stroke-width="3"/>
    <polygon points="340,196 326,191 332,202" fill="#f85149"/>
    <text x="28" y="212" fill="#f85149" font-size="12">光线</text>

    <text x="180" y="228" fill="#3fb950" font-size="13" text-anchor="middle">
      → 直接排除！一次球体求交都不用做
    </text>
  </g>

  <!-- ============ 下方：slab method ============ -->
  <g transform="translate(60, 330)">
    <rect x="0" y="0" width="800" height="115" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="28" fill="#8b949e" font-size="14">
      slab method：三个轴各给出一段 t 区间，取交集
    </text>

    <text x="20" y="56" fill="#58a6ff" font-size="13">x 板</text>
    <line x1="80" y1="52" x2="700" y2="52" stroke="#30363d" stroke-width="2"/>
    <line x1="160" y1="46" x2="480" y2="46" stroke="#58a6ff" stroke-width="5" stroke-linecap="round"/>
    <text x="170" y="38" fill="#58a6ff" font-size="11">[2, 8]</text>

    <text x="20" y="80" fill="#d29922" font-size="13">y 板</text>
    <line x1="80" y1="76" x2="700" y2="76" stroke="#30363d" stroke-width="2"/>
    <line x1="300" y1="70" x2="520" y2="70" stroke="#d29922" stroke-width="5" stroke-linecap="round"/>
    <text x="310" y="62" fill="#d29922" font-size="11">[4, 6]</text>

    <text x="20" y="104" fill="#3fb950" font-size="13">交集</text>
    <line x1="80" y1="100" x2="700" y2="100" stroke="#30363d" stroke-width="2"/>
    <line x1="300" y1="94" x2="480" y2="94" stroke="#3fb950" stroke-width="5" stroke-linecap="round"/>
    <text x="310" y="86" fill="#3fb950" font-size="11">[4, 6] 非空 → 命中 ✓</text>

    <text x="716" y="56" fill="#8b949e" font-size="11">t</text>
  </g>
</svg>
