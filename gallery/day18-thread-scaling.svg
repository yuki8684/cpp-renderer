<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">
  <rect width="960" height="480" fill="#0d1117"/>

  <text x="40" y="42" font-size="21" font-weight="700" fill="#e6edf3" font-family="Segoe UI, Arial">Multithread scaling &#8212; Cornell Box 128 spp, 400x225</text>
  <text x="40" y="66" font-size="12.5" fill="#8b949e" font-family="Segoe UI, Arial">Intel(R) Core(TM) i7-14650HX &#183; 16 physical / 24 logical cores &#183; image is byte-identical for every thread count</text>

  <!-- ============ panel A : speedup ============ -->
  <text x="80" y="116" font-size="14.5" font-weight="600" fill="#e6edf3" font-family="Segoe UI, Arial">Speedup vs threads</text>

  <line x1="80" y1="380" x2="440" y2="380" stroke="#30363d" stroke-width="1"/>
  <line x1="80" y1="380" x2="80" y2="140" stroke="#30363d" stroke-width="1"/>

  <polyline points="80.0,370.0 95.7,360.0 127.0,340.0 189.6,300.0 314.8,220.0 440.0,140.0" fill="none" stroke="#484f58" stroke-width="2" stroke-dasharray="6,5"/>
  <polyline points="80.0,370.0 95.7,360.9 127.0,347.7 189.6,337.3 314.8,332.3 440.0,329.0" fill="none" stroke="#f0883e" stroke-width="2.5"/>
  <circle cx="80.0" cy="370.0" r="4.5" fill="#f0883e" stroke="#0d1117" stroke-width="1.5"/><text x="80.0" y="359.0" font-size="11" fill="#f0883e" text-anchor="middle">1.00x</text><circle cx="95.7" cy="360.9" r="4.5" fill="#f0883e" stroke="#0d1117" stroke-width="1.5"/><text x="95.7" y="349.9" font-size="11" fill="#f0883e" text-anchor="middle">1.91x</text><circle cx="127.0" cy="347.7" r="4.5" fill="#f0883e" stroke="#0d1117" stroke-width="1.5"/><text x="127.0" y="336.7" font-size="11" fill="#f0883e" text-anchor="middle">3.23x</text><circle cx="189.6" cy="337.3" r="4.5" fill="#f0883e" stroke="#0d1117" stroke-width="1.5"/><text x="189.6" y="326.3" font-size="11" fill="#f0883e" text-anchor="middle">4.27x</text><circle cx="314.8" cy="332.3" r="4.5" fill="#f0883e" stroke="#0d1117" stroke-width="1.5"/><text x="314.8" y="321.3" font-size="11" fill="#f0883e" text-anchor="middle">4.77x</text><circle cx="440.0" cy="329.0" r="4.5" fill="#f0883e" stroke="#0d1117" stroke-width="1.5"/><text x="440.0" y="318.0" font-size="11" fill="#f0883e" text-anchor="middle">5.10x</text>
  <text x="80.0" y="400.0" font-size="12" fill="#8b949e" text-anchor="middle">1</text><text x="95.7" y="400.0" font-size="12" fill="#8b949e" text-anchor="middle">2</text><text x="127.0" y="400.0" font-size="12" fill="#8b949e" text-anchor="middle">4</text><text x="189.6" y="400.0" font-size="12" fill="#8b949e" text-anchor="middle">8</text><text x="314.8" y="400.0" font-size="12" fill="#8b949e" text-anchor="middle">16</text><text x="440.0" y="400.0" font-size="12" fill="#8b949e" text-anchor="middle">24</text>

  <text x="90" y="160" font-size="11.5" fill="#8b949e" text-anchor="start" font-family="Segoe UI, Arial">ideal (speedup = threads)</text>
  <text x="80" y="426" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Segoe UI, Arial">threads</text>
  <text x="46" y="260" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Segoe UI, Arial" transform="rotate(-90 46 260)">speedup</text>

  <!-- ============ panel B : wall time ============ -->
  <text x="570" y="116" font-size="14.5" font-weight="600" fill="#e6edf3" font-family="Segoe UI, Arial">Wall time vs threads</text>

  <line x1="570" y1="380" x2="900" y2="380" stroke="#30363d" stroke-width="1"/>
  <line x1="570" y1="380" x2="570" y2="140" stroke="#30363d" stroke-width="1"/>
  <rect x="580.5" y="140.0" width="34" height="240.0" rx="3" fill="#f0883e" opacity="0.85"/><text x="597.5" y="134.0" font-size="11" fill="#c9d1d9" text-anchor="middle">24.13s</text><rect x="635.5" y="254.6" width="34" height="125.4" rx="3" fill="#f0883e" opacity="0.85"/><text x="652.5" y="248.6" font-size="11" fill="#c9d1d9" text-anchor="middle">12.60s</text><rect x="690.5" y="305.7" width="34" height="74.3" rx="3" fill="#f0883e" opacity="0.85"/><text x="707.5" y="299.7" font-size="11" fill="#c9d1d9" text-anchor="middle">7.47s</text><rect x="745.5" y="323.8" width="34" height="56.2" rx="3" fill="#f0883e" opacity="0.85"/><text x="762.5" y="317.8" font-size="11" fill="#c9d1d9" text-anchor="middle">5.65s</text><rect x="800.5" y="329.6" width="34" height="50.4" rx="3" fill="#f0883e" opacity="0.85"/><text x="817.5" y="323.6" font-size="11" fill="#c9d1d9" text-anchor="middle">5.06s</text><rect x="855.5" y="333.0" width="34" height="47.0" rx="3" fill="#f0883e" opacity="0.85"/><text x="872.5" y="327.0" font-size="11" fill="#c9d1d9" text-anchor="middle">4.73s</text>
  <text x="597.5" y="400.0" font-size="12" fill="#8b949e" text-anchor="middle">1</text><text x="652.5" y="400.0" font-size="12" fill="#8b949e" text-anchor="middle">2</text><text x="707.5" y="400.0" font-size="12" fill="#8b949e" text-anchor="middle">4</text><text x="762.5" y="400.0" font-size="12" fill="#8b949e" text-anchor="middle">8</text><text x="817.5" y="400.0" font-size="12" fill="#8b949e" text-anchor="middle">16</text><text x="872.5" y="400.0" font-size="12" fill="#8b949e" text-anchor="middle">24</text>

  <text x="735" y="426" font-size="12" fill="#8b949e" text-anchor="middle" font-family="Segoe UI, Arial">threads</text>

  <!-- ============ footnote ============ -->
  <text x="40" y="462" font-size="12" fill="#8b949e" font-family="Segoe UI, Arial">Not linear because: single-core boost clock (~5.2 GHz) drops under all-core load, P/E hybrid cores, SMT shares execution units, memory bandwidth is shared.</text>
</svg>
